[package]
name = "craftpilot-runtime-agent"
version = "0.16.6"
edition = "2021"
rust-version = "1.88"
description = "Rust runtime agent for CraftPilot (same HTTP contract as the Python agent)"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
hkdf = "0.12"
x25519-dalek = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "8"
futures-util = "0.3"
bollard = "0.21.1"
# Push-kanal (2026-11-25): agenten prenumererar på nodens egen Reverb-kanal
# i stället för att bara polla. Samma rustls-rötter som reqwest använder.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[profile.release]
strip = true
lto = "thin"
